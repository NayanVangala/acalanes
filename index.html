<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runnr</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 16px; color: #1a1a1a; background: #fff; }
  textarea { width: 100%; height: 220px; font: 14px/1.4 ui-monospace, monospace; box-sizing: border-box; }
  button { font: inherit; padding: .4rem .9rem; margin: .5rem .5rem 1rem 0; cursor: pointer; }
  .step { border-left: 4px solid #ccc; padding: .4rem .8rem; margin: .4rem 0; white-space: pre-wrap; }
  .step.bad { border-color: #c62828; background: #fdecea; }
  .why { color: #c62828; font-size: 14px; margin-top: .3rem; }
  mark { background: #ffcdd2; font-weight: 600; }
  #meta { font-size: 14px; color: #555; }
</style>
</head>
<body>
<h1>Runnr</h1>
<p>Paste a lab protocol. Each step is compared with 100 real published protocols, and unusual amounts are flagged.</p>
<textarea id="text" placeholder="1. Add 20 µL ...&#10;2. Centrifuge at 12,000 x g for 1 min"></textarea>
<button id="check">Check protocol</button><button id="example">Try a real protocol with a hidden mistake</button>
<div id="meta"></div>
<div id="out"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function render(trace) {
  const bad = trace.filter(s => s.flags.length).length;
  $("out").innerHTML = `<p><b>${bad}</b> of ${trace.length} steps flagged.</p>` + trace.map(s => {
    let t = s.text;
    for (const f of [...s.flags].sort((a, b) => b.pos[0] - a.pos[0]))
      t = t.slice(0, f.pos[0]) + "\u0001" + t.slice(f.pos[0], f.pos[1]) + "\u0002" + t.slice(f.pos[1]);
    t = esc(t).replace(/\u0001/g, "<mark>").replace(/\u0002/g, "</mark>");
    const why = s.flags.map(f => `<div class="why">⚠ ${esc(f.why)}</div>`).join("");
    return `<div class="step ${s.flags.length ? "bad" : ""}"><b>${s.step}.</b> ${t}${why}</div>`;
  }).join("");
}

$("check").onclick = async () => {
  $("meta").textContent = "";
  const r = await fetch("/check", {method: "POST", body: JSON.stringify({text: $("text").value})});
  render((await r.json()).trace);
};
$("example").onclick = async () => {
  const d = await (await fetch("/example")).json();
  $("text").value = d.text;
  $("meta").innerHTML = `<a href="${d.url}" target="_blank">${esc(d.title)}</a> · answer key: a <b>${d.inserted.error}</b> error was inserted in step <b>${d.inserted.step}</b>`;
  render(d.trace);
};
</script>
</body>
</html>
